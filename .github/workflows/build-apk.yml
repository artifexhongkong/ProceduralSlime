name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Build name (e.g. v0.1.0-beta)'
        required: false
        default: ''

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_PLATFORM: 'android-36'

jobs:
  build:
    name: Build APK for Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;36.0.0'

      - name: Install Cordova CLI
        run: npm install -g cordova@13

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build IIFE bundle (for Cordova file:// compatibility)
        run: |
          npx esbuild src/main.ts --bundle --format=iife --target=es2020 \
            --outfile=dist/game-iife.js --minify --loader:.ts=ts \
            --define:import.meta.url='"."' --log-level=warning

      - name: Inline JS to index.html
        run: |
          cp index.html dist/index.html
          python3 -c "
          with open('dist/game-iife.js', 'r') as f:
              js = f.read()
          with open('dist/index.html', 'r') as f:
              html = f.read()
          html = html.replace('</body>', '<script>' + js + '</script>\n</body>')
          with open('dist/index.html', 'w') as f:
              f.write(html)
          print(f'Inlined, size: {len(html)} bytes')
          "
          cp public/gooey-processor.js dist/

      - name: Sync to cordova www
        run: |
          rm -rf cordova/www
          mkdir -p cordova/www
          cp -r dist/* cordova/www/
          ls -la cordova/www/

      - name: Build APK
        working-directory: cordova
        run: |
          cordova platform add android --no-save
          cordova build android --debug 2>&1 | tail -30
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProceduralSlime-APK-${{ github.run_number }}
          path: cordova/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Compute Version Tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "tag=${LATEST_TAG}-dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Procedural Slime ${{ steps.version.outputs.tag }}
          body: |
            # Procedural Slime ${{ steps.version.outputs.tag }}

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ## 安裝
            下載 `.apk` 後安裝，允許「安裝未知來源應用」。

            ## 改進
            - 加大史萊姆尺寸與融合程度（28 質點、smin k=0.25）
            - 加強高光、折射與 Fresnel 邊緣微光
            - 加入振動回饋
            - 修正 UI 點擊被 rotate-hint 阻擋問題
            - AudioWorklet 失敗時 fallback 到 ScriptProcessorNode
            - 使用 inline IIFE bundle（解決 Cordova file:// 下 ESM module 無法載入問題）
          files: cordova/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
